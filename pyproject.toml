[project]
name = "pqready"
version = "0.2.0"
description = "PQC readiness scanner: TLS endpoints, source code, and certificate files"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "pqready contributors" },
]
keywords = ["post-quantum", "cryptography", "pqc", "tls", "security", "scanner"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Security :: Cryptography",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "sslyze>=5.2",
  "cryptography>=42.0",
  "click>=8.1",
  "jinja2>=3.1",
  "fastmcp>=0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.4",
  "build>=1.0",
  "hatchling>=1.20",
]

[project.scripts]
pqready     = "pqready.cli:main"
pqready-mcp = "pqready.mcp_server:main"

[project.urls]
Homepage   = "https://github.com/shanglai/pqready"
Repository = "https://github.com/shanglai/pqready"
Issues     = "https://github.com/shanglai/pqready/issues"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pqready"]

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# UP042: spec explicitly defines `class Severity(str, Enum)`; do not auto-rewrite to StrEnum.
ignore = ["E501", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
